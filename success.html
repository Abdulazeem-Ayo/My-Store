<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful | Haryobhamhi Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="checkout-header">

        <div class="logo">
            HARYOBHAMHI STORE
        </div>

        <a href="index.html">
            Continue Shopping
        </a>

    </header>


    <main class="success-page">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Order Successful!
            </h1>

            <p>
                Thank you for shopping with
                Haryobhamhi Store.
            </p>

            <p id="order-number">
                Your order number will appear here.
            </p>


            <div
                id="success-items"
                class="success-items"
            >
            </div>


            <div class="success-total">

                <span>
                    Order Total
                </span>

                <strong id="success-total">
                    ₦0
                </strong>

            </div>


            <div class="success-actions">

                <a
                    href="index.html"
                    class="continue-shopping"
                >
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>


    <script src="js/success.js"></script>

</body>
</html>
