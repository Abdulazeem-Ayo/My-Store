<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Haryobhamhi Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="logo">
            HARYOBHAMHI
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>
        </nav>

        <button
            class="cart-btn"
            onclick="window.location.href='cart.html'"
        >
            Cart (0)
        </button>

    </header>


    <!-- =========================
         CART
    ========================== -->

    <main class="cart-page">

        <div class="cart-header">

            <h1>
                Your Cart
            </h1>

            <a href="index.html">
                ← Continue Shopping
            </a>

        </div>


        <div
            id="cart-container"
            class="cart-container"
        >
            <p>
                Loading cart...
            </p>
        </div>


        <!-- CART SUMMARY -->

        <div
            id="cart-summary"
            class="cart-summary"
        >
        </div>

    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/cart.js"></script>

</body>

</html>
