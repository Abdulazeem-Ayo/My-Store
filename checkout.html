<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Haryobhamhi Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="logo">
            HARYOBHAMHI
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

        <button
            class="cart-btn"
            onclick="window.location.href='cart.html'"
        >
            Cart (0)
        </button>

    </header>


    <!-- =========================
         CHECKOUT
    ========================== -->

    <main class="checkout-page">

        <div class="checkout-header">

            <h1>
                Checkout
            </h1>

            <a href="cart.html">
                ← Back to Cart
            </a>

        </div>


        <div class="checkout-layout">


            <!-- =========================
                 CUSTOMER INFORMATION
            ========================== -->

            <section class="checkout-form">

                <h2>
                    Delivery Information
                </h2>


                <form id="checkout-form">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="full-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="08012345678"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group">

                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="Enter your full delivery address"
                            rows="4"
                            required
                        ></textarea>

                    </div>


                    <!-- CITY -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>


                    <!-- STATE -->

                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            name="state"
                            placeholder="Enter your state"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Continue to Payment
                    </button>

                </form>

            </section>


            <!-- =========================
                 ORDER SUMMARY
            ========================== -->

            <aside
                class="checkout-summary"
                id="checkout-summary"
            >

                <h2>
                    Your Order
                </h2>

                <div id="checkout-items">
                    Loading...
                </div>

                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <strong id="checkout-total">
                        ₦0
                    </strong>

                </div>

            </aside>


        </div>

    </main>


    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/checkout.js"></script>

</body>

</html>
